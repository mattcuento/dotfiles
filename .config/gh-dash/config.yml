prSections:
  - title: My Pull Requests
    filters: is:open author:@me
  - title: Needs My Review
    filters: is:open review-requested:@me
  - title: Involved
    filters: is:open involves:@me -author:@me
issuesSections:
  - title: My Issues
    filters: is:open author:@me
  - title: Assigned
    filters: is:open assignee:@me
  - title: Involved
    filters: is:open involves:@me -author:@me
notificationsSections:
  - title: All
    filters: ""
  - title: Created
    filters: reason:author
  - title: Participating
    filters: reason:participating
  - title: Mentioned
    filters: reason:mention
  - title: Review Requested
    filters: reason:review-requested
  - title: Assigned
    filters: reason:assign
  - title: Subscribed
    filters: reason:subscribed
  - title: Team Mentioned
    filters: reason:team-mention
repo:
  branchesRefetchIntervalSeconds: 30
  prsRefetchIntervalSeconds: 60
defaults:
  preview:
    open: true
    width: 0.45
    height: 0.6
    position: auto
  prsLimit: 20
  prApproveComment: LGTM
  issuesLimit: 20
  notificationsLimit: 20
  view: prs
  layout:
    prs:
      updatedAt:
        width: 5
      createdAt:
        width: 5
      repo:
        width: 20
      author:
        width: 15
      authorIcon:
        hidden: false
      labels:
        width: 22
        hidden: true
      assignees:
        width: 20
        hidden: true
      base:
        width: 15
        hidden: true
      lines:
        width: 15
    issues:
      updatedAt:
        width: 5
      createdAt:
        width: 5
      repo:
        width: 15
      creator:
        width: 10
      creatorIcon:
        hidden: false
      assignees:
        width: 20
        hidden: true
  refetchIntervalMinutes: 30
keybindings:
  prs:
    - key: C
      name: code review (tuicr)
      command: >
        zellij run --floating --close-on-exit
        --width 90% --height 90% --x 5% --y 5%
        --name "tuicr {{.RepoName}}#{{.PrNumber}}"
        -- tuicr pr "{{.RepoName}}#{{.PrNumber}}"
repoPaths: {}
theme:
  ui:
    sectionsShowCount: true
    table:
      showSeparator: true
      compact: false
  colors:
    text:
      primary: "#dfdedc" # fg0 (Soft White)
      secondary: "#a89984" # Gray
      inverted: "#2d353b" # bg0 (Dark Medium)
      faint: "#7c6f64" # Statusline/Muted line
      warning: "#ff922b" # Orange
      success: "#a7c080" # Green
      actor: "#d3c6aa" # fg
    background:
      selected: "#475258" # bg4 (Visual Selection)
    border:
      primary: "#505a60" # bg5
      secondary: "#343f44" # bg1
      faint: "#3d484d" # bg2
    inline:
      icons:
        newcontributor: "#a7c080" # Green
        contributor: "#83c092" # Aqua
        collaborator: "#dbbc7f" # Yellow
        member: "#e69875" # Orange
        owner: "#7fbbb3" # Blue
        unknownrole: "#e67e80" # Red
pager:
  diff: ""
confirmQuit: false
showAuthorIcons: true
smartFilteringAtLaunch: true
includeReadNotifications: true
